<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClipperAPP091</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f4efe6;
      --muted: rgba(244, 239, 230, 0.78);
      --accent: #7ec8c3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(ellipse 90% 70% at 15% 20%, rgba(126, 200, 195, 0.22), transparent 55%),
        radial-gradient(ellipse 80% 60% at 85% 75%, rgba(232, 140, 90, 0.16), transparent 50%),
        linear-gradient(160deg, #1a2a32 0%, #0f1a1f 45%, #162428 100%);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(244, 239, 230, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244, 239, 230, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black, transparent);
      pointer-events: none;
    }

    main {
      position: relative;
      max-width: 36rem;
      animation: rise 0.9s ease-out both;
    }

    h1 {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(2.75rem, 8vw, 4.25rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
      margin-bottom: 1.25rem;
    }

    h1 span {
      background: linear-gradient(120deg, var(--ink) 30%, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.55;
      color: var(--muted);
      font-weight: 400;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <h1><span>ClipperAPP091</span></h1>
    <p>
      Local tool that turns YouTube videos into short clips and sends drafts
      to my TikTok inbox for review.
    </p>
  </main>
</body>
</html>
